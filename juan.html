        --plaque-top:#111111;

        --metal-1:#cfcfcf;

    }

        background-image:

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        color: #f3efe8;
        overflow: hidden;
        background: radial-gradient(circle, #1e1e1e, #121212);
    }

    /* embossed plaque title (skeuomorphic) */
    .title {
        position: fixed;
        top: 0;
        width: 100%;
        max-width: 980px;
        height: 64px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid rgba(0,0,0,0.7);
        background: linear-gradient(180deg, var(--plaque-top), var(--plaque-bottom));
        box-shadow:
            0 8px 18px rgba(0,0,0,0.6),
            inset 0 2px 2px rgba(255,255,255,0.03),
            inset 0 -3px 6px rgba(0,0,0,0.6);
        text-shadow: 0 1px 0 rgba(255,255,255,0.05), 0 -2px 6px rgba(0,0,0,0.8);
        z-index: 40;
        backdrop-filter: blur(2px);
    }

    .title h1 {
        margin: 0;
        letter-spacing: 1px;
        font-size: 20px;
        color: #f6efe6;
    }

    /* viewer frame (wood/metal + glass) */
    .viewer {
        margin-top: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 92%;
        max-width: 980px;
        padding: 28px;
        background:
            linear-gradient(180deg, rgba(34, 34, 34, 0.753), rgba(0, 0, 0, 0.712)),
            url(frame.jpg);
        background-size: cover;
        background-position: center;
        box-shadow:
            0 20px 50px rgba(0,0,0,0.7),
            0 6px 14px rgba(0,0,0,0.5),
            inset 0 2px 8px rgba(255,255,255,0.02);
        position: relative;
        z-index: 10;
         -webkit-box-reflect: below 1px linear-gradient(transparent, rgba(255,255,255,0.02));
    }

    .frame {
        position: relative;
        border-radius: 12px;
        padding: 12px;
        background: linear-gradient(180deg,#2f231c,#1e1411),
        url(wood.jpg);
        background-size: cover;
        background-position: center;
        box-shadow:
            0 16px 30px rgba(0,0,0,0.7),
            inset 0 2px 6px rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.03);
       
    }

    /* stitched trim using gradients */
    .frame::before{
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 10px;
        background:
            linear-gradient(90deg, rgba(255,255,255,0.02), transparent 30%),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 8px);
        pointer-events: none;
        mix-blend-mode: overlay;
        opacity: 0.6;
    }

    img {
        display:block;
        max-width: 80vw;
        max-height: 64vh;
        width: auto;
        height: auto;
        border-radius: 8px;
        box-shadow:
            0 18px 40px rgba(0,0,0,0.7),
            inset 0 1px 0 rgba(255,255,255,0.04),
            0 6px 18px rgba(0,0,0,0.6);
        transform: translateZ(0);
        background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.12));
    }

    /* subtle glass reflection fake */
    img::after{
        content: "";
    }

    /* skeuomorphic circular control buttons */
    .controls {
        display:flex;
        gap:14px;
        justify-content:center;
        margin-top:16px;
    }

    .btn {
        width:56px;
        height:56px;
        border-radius: 50%;
        display:flex;
        align-items:center;
        justify-content:center;
        background-image: url('button.png');
        
        background-position: center;
        box-shadow:
            0 6px 14px rgba(0,0,0,0.6),
            inset 0 2px 4px rgba(255,255,255,0.6),
            inset 0 -4px 8px rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.25);
        color:#1b1b1b;
        cursor: pointer;
        user-select: none;
        -webkit-box-reflect: below 4px linear-gradient(transparent, rgba(255,255,255,0.1));
    }

    .btn:active{
        transform: translateY(3px);
        box-shadow:
            0 3px 8px rgba(0,0,0,0.6),
            inset 0 1px 2px rgba(0,0,0,0.5);
    }

    p#countdownToNext {
        margin-top:14px;
        color:#d9cfc6;
        font-size:12px;
        opacity:0.9;
    }

</style>
<body>

    <div class="viewer">
        <div class="frame">
            <img src="0-1.jpg" id="photos" height="426" width="640" alt="The Juan Files"/>
        </div>
    </div>

    <div class="controls" aria-hidden="false">
        <button class="btn" id="prevBtn" title="Previous">⏪</button>
        <button style="width: 62px; height: 62px;" class="btn" id="playPause" title="Pause/Play">⏯</button>
        <button class="btn" id="nextBtn" title="Next">⏩</button>
    </div>

    <p id="countdownToNext">The Juan Files - 2026</p>

    <script>
        // ...existing code...
        var myImageArray = ["0-1.jpg","0-2.jpg","0-3.jpg","0-4.jpg","0-5.jpg","0-6.jpg","0-7.jpg"];
        var position = 0;
        var intervalMs = 2500;
        var playing = true;
        var timer = setInterval(nextImage, intervalMs);

        function nextImage() {
            position++;
            if (position > myImageArray.length - 1) position = 0;
            document.getElementById("photos").src = myImageArray[position];
        }

        function prevImage() {
            position--;
            if (position < 0) position = myImageArray.length - 1;
            document.getElementById("photos").src = myImageArray[position];
        }

        document.getElementById('prevBtn').addEventListener('click', function(){
            prevImage();
            resetTimer();
        });
        document.getElementById('nextBtn').addEventListener('click', function(){
            nextImage();
            resetTimer();
        });
        document.getElementById('playPause').addEventListener('click', function(){
            playing = !playing;
            if(playing){
                timer = setInterval(nextImage, intervalMs);
            } else {
                clearInterval(timer);
            }
        });

        function resetTimer(){
            if(playing){
                clearInterval(timer);
                timer = setInterval(nextImage, intervalMs);
            }
        }
        // ...existing code...
    </script>
</body>
</html>
